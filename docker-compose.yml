services:
  mongodb:
    image: mongo:7
    container_name: kuli-mongodb
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: kuli
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: kuli-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongodb-data:
  redis-data:
