services:
  postgres:
    image: postgres:16-alpine
    container_name: kuli-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuli_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kuli_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuli} -d ${POSTGRES_DB:-kuli_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: kuli-mongodb
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: kuli
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: kuli-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
