<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification | Kulli Logistics Platform</title>
  <meta name="description" content="Verify your phone number with Kulli OTP authentication for secure access in Ethiopia.">
  <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg">
  
  <link rel="stylesheet" href="/src/styles/fonts.css">
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/typography.css">
  <link rel="stylesheet" href="/src/styles/layout.css">
  <link rel="stylesheet" href="/src/styles/auth.css">
</head>
<body data-auth-mode="otp">
  <main class="auth-otp-wrapper">
    <div class="auth-otp-card" role="region" aria-labelledby="otp-title">
      
      <!-- Top Navigation -->
      <nav class="auth-otp-nav" aria-label="Verification Navigation">
        <a href="/login.html" class="btn-otp-back" aria-label="Back to Login">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <a href="/" aria-label="Kulli Home">
          <img src="/logos/kulli-logo-primary.svg" alt="Kulli" style="height: 28px;">
        </a>
        <div style="width: 38px;" aria-hidden="true"></div>
      </nav>

      <h1 id="otp-title" class="otp-title">OTP Verification</h1>
      <p class="otp-subtitle">
        Verify Your Phone Number<br>
        We’ve sent a verification code to <span class="otp-target-highlight">+251 911 234 567</span>. Enter the 6-digit code to continue.
      </p>

      <form class="auth-form" action="#" method="POST" onsubmit="event.preventDefault(); window.location.href='/';">
        <!-- 6-digit OTP Inputs -->
        <div class="otp-inputs-grid" role="group" aria-label="6-Digit Verification Code">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 1" autofocus required>
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 2" required>
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 3" required>
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 4" required>
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 5" required>
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 6" required>
        </div>

        <!-- Timer & Resend -->
        <div class="otp-timer-wrap">
          <span>Resend Code in </span>
          <span class="otp-timer-count" data-otp-countdown>01:00</span>
          <button type="button" class="btn-otp-resend" data-otp-resend disabled>Resend Code</button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit">
          Verify &amp; Continue
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or</span>
        </div>

        <a href="/login.html" class="btn-auth-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span>Continue with Email &amp; Password</span>
        </a>

        <!-- Switch Footer -->
        <footer class="auth-switch-footer" style="margin-top: 1rem;">
          <a href="/signup.html" class="auth-switch-link">Need to register a new account?</a>
        </footer>
      </form>

    </div>
  </main>

  <script type="module" src="/src/scripts/auth.ts"></script>
</body>
</html>
