<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%" fill="none">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="107" rx="105" ry="6" fill="#0C1A3A" opacity="0.14"/>
  
  <!-- Reinforced Heavy I-Beam Chassis -->
  <rect x="20" y="78" width="195" height="10" rx="2" fill="#0F172A"/>
  
  <!-- Heavy Duty Hydraulic Tipper Dump Body -->
  <path d="M72 32H206C208.5 32 210.5 34 210.5 36.5L208 78H72V32Z" fill="#F97316"/>
  <!-- Top Cab-Protector Canopy (Cab Shield) -->
  <path d="M60 26L72 32H74V38H60V26Z" fill="#EA580C"/>
  <!-- Dump Box Reinforcement Ribs -->
  <rect x="95" y="34" width="4" height="42" fill="#C2410C"/>
  <rect x="122" y="34" width="4" height="42" fill="#C2410C"/>
  <rect x="150" y="34" width="4" height="42" fill="#C2410C"/>
  <rect x="178" y="34" width="4" height="42" fill="#C2410C"/>
  <!-- Horizontal Stiffener Bar -->
  <line x1="72" y1="55" x2="209" y2="55" stroke="#C2410C" stroke-width="2.5"/>
  
  <!-- Hydraulic Lift Cylinder Assembly -->
  <path d="M68 62L76 78H82L74 62H68Z" fill="#475569"/>
  
  <!-- Heavy Cab-Over Cabin (Sino Truck / HOWO style) -->
  <path d="M22 78V36C22 31 26 28 31 28H64C66.5 28 68.5 30 68.5 32.5V78H22Z" fill="#0C1A3A"/>
  <!-- Sun Visor -->
  <path d="M19 33L26 31H45L40 35H19V33Z" fill="#F97316"/>
  
  <!-- Windshield & Large Side Window -->
  <path d="M24 37H44V54H24V37Z" fill="#93C5FD" opacity="0.85"/>
  <path d="M48 37H64V54H48V37Z" fill="#93C5FD" opacity="0.85"/>
  
  <!-- Heavy Cab Door & Handle -->
  <rect x="46" y="35" width="20" height="42" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="50" y="58" width="6" height="2" rx="1" fill="#CBD5E1"/>
  <!-- Big West Coast Mirrors -->
  <rect x="18" y="40" width="3" height="14" rx="1" fill="#0F172A"/>
  <line x1="21" y1="44" x2="24" y2="44" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="21" y1="50" x2="24" y2="50" stroke="#0F172A" stroke-width="1.5"/>
  
  <!-- Heavy Steel Bumper with Tow Pin -->
  <rect x="18" y="70" width="12" height="12" rx="2" fill="#334155"/>
  <rect x="20" y="60" width="4" height="6" fill="#F8FAFC"/>
  <rect x="20" y="67" width="4" height="3" fill="#F59E0B"/>
  
  <!-- Heavy Tandem Suspension Cutouts -->
  <path d="M38 78C38 68 46 60 56 60C66 60 74 68 74 78H38Z" fill="#0C1A3A" opacity="0.4"/>
  <path d="M136 78C136 68 144 60 154 60C164 60 172 68 172 78H136Z" fill="#0C1A3A" opacity="0.4"/>
  <path d="M172 78C172 68 180 60 190 60C200 60 208 68 208 78H172Z" fill="#0C1A3A" opacity="0.4"/>
  
  <!-- Front Steer Wheel (Extra Heavy) -->
  <circle cx="56" cy="85" r="17" fill="#0F172A"/>
  <circle cx="56" cy="85" r="10" fill="#64748B"/>
  <circle cx="56" cy="85" r="5" fill="#1E293B"/>
  
  <!-- Rear Tandem Bogie Axle 1 -->
  <circle cx="154" cy="85" r="17" fill="#0F172A"/>
  <circle cx="154" cy="85" r="10" fill="#64748B"/>
  <circle cx="154" cy="85" r="5" fill="#1E293B"/>
  
  <!-- Rear Tandem Bogie Axle 2 -->
  <circle cx="190" cy="85" r="17" fill="#0F172A"/>
  <circle cx="190" cy="85" r="10" fill="#64748B"/>
  <circle cx="190" cy="85" r="5" fill="#1E293B"/>
