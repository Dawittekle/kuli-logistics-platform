<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="100%" height="100%" fill="none">
  <!-- Ground Shadow -->
  <ellipse cx="120" cy="107" rx="100" ry="6" fill="#0C1A3A" opacity="0.12"/>
  
  <!-- Heavy Chassis Steel Frame -->
  <rect x="25" y="80" width="186" height="8" rx="2" fill="#1E293B"/>
  
  <!-- High-Sided Wooden/Steel Flatbed Body -->
  <rect x="76" y="38" width="134" height="42" rx="2" fill="#2563EB"/>
  <rect x="74" y="34" width="138" height="5" rx="1" fill="#1D4ED8"/>
  <!-- High-sided stake vertical bars -->
  <rect x="105" y="38" width="4" height="42" fill="#1E40AF" opacity="0.45"/>
  <rect x="135" y="38" width="4" height="42" fill="#1E40AF" opacity="0.45"/>
  <rect x="165" y="38" width="4" height="42" fill="#1E40AF" opacity="0.45"/>
  <rect x="195" y="38" width="4" height="42" fill="#1E40AF" opacity="0.45"/>
  <!-- Stake Horizontal Rails -->
  <line x1="76" y1="52" x2="210" y2="52" stroke="#1E40AF" stroke-width="2" opacity="0.5"/>
  <line x1="76" y1="66" x2="210" y2="66" stroke="#1E40AF" stroke-width="2" opacity="0.5"/>
  
  <!-- Cab-Over Forward Control Cabin (Isuzu NPR style) -->
  <path d="M26 80V40C26 36 29 33 33 33H68C71 33 73 35 73 38V80H26Z" fill="#0C1A3A"/>
  
  <!-- Windshield & Door Window -->
  <path d="M28 39H48V56H28V39Z" fill="#93C5FD" opacity="0.85"/>
  <path d="M52 39H68V56H52V39Z" fill="#93C5FD" opacity="0.85"/>
  
  <!-- Driver Cab Door Line & Mirror -->
  <rect x="50" y="36" width="22" height="44" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="54" y="62" width="6" height="2" rx="1" fill="#CBD5E1"/>
  <!-- Side Mirror -->
  <rect x="22" y="44" width="3" height="10" rx="1" fill="#0F172A"/>
  <line x1="25" y1="48" x2="28" y2="48" stroke="#0F172A" stroke-width="1.5"/>
  
  <!-- Front Bumper & Low Step -->
  <rect x="23" y="74" width="10" height="8" rx="2" fill="#475569"/>
  <!-- Amber Turn Signal & Headlight -->
  <rect x="24" y="66" width="4" height="5" rx="1" fill="#F59E0B"/>
  <rect x="24" y="58" width="3" height="6" fill="#F8FAFC"/>
  <!-- Front Grille Lines -->
  <line x1="30" y1="67" x2="44" y2="67" stroke="#475569" stroke-width="1.5"/>
  <line x1="30" y1="71" x2="44" y2="71" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Wheel Arches -->
  <path d="M42 80C42 70 50 62 60 62C70 62 78 70 78 80H42Z" fill="#0C1A3A" opacity="0.3"/>
  <path d="M148 80C148 70 156 62 166 62C176 62 184 70 184 80H148Z" fill="#0C1A3A" opacity="0.3"/>
  
  <!-- Fuel Tank under flatbed -->
  <rect x="94" y="76" width="26" height="10" rx="2" fill="#64748B"/>
  
  <!-- Front Steer Wheel -->
  <circle cx="60" cy="85" r="17" fill="#0F172A"/>
  <circle cx="60" cy="85" r="10" fill="#94A3B8"/>
  <circle cx="60" cy="85" r="5" fill="#1E293B"/>
  
  <!-- Dual Rear Wheels (Tandem / Heavy Duty) -->
  <circle cx="166" cy="85" r="17" fill="#0F172A"/>
  <circle cx="166" cy="85" r="10" fill="#94A3B8"/>
  <circle cx="166" cy="85" r="5" fill="#1E293B"/>
  
  <!-- Kinetic Brand Orange Ribbon -->
  <rect x="76" y="74" width="134" height="4" fill="#F97316"/>
</svg>
