  <line x1="199" y1="35" x2="199" y2="82" stroke="#0F172A" stroke-width="1.5"/>
  <rect x="193" y="58" width="4" height="2" rx="1" fill="#CBD5E1"/>
  
  <!-- Front Bumper & Headlights -->
  <path d="M38 77C38 74 39.5 72 42 72H44V85H40C38.9 85 38 84.1 38 83V77Z" fill="#475569"/>
  <path d="M40 64H44V70H40C39 70 38.5 68.5 39 67.5L40 64Z" fill="#F59E0B"/>
  
  <!-- Wheel Well Cutouts -->
