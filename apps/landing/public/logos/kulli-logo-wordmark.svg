<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <title>Kulli Wordmark</title>
  <!--
    KULLI wordmark — geometric uppercase letterforms as paths.
    "K" in orange (#F97316), "ULLI" in navy (#0C1A3A).
    Space Grotesk-inspired with generous tracking.
    Stroke weight ~5.5, rounded caps.
    Baseline at y=40, cap-height at y=8.
  -->
  <!-- K (orange) -->
  <g stroke="#F97316" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="8" y1="8" x2="8" y2="40"/>
    <line x1="14" y1="25" x2="30" y2="8"/>
    <line x1="14" y1="25" x2="30" y2="40"/>
  </g>
  <!-- U (navy) -->
  <g stroke="#0C1A3A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M42,8 L42,32 Q42,40 50,40 Q58,40 58,32 L58,8"/>
  </g>
  <!-- L (navy) -->
  <g stroke="#0C1A3A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="72" y1="8" x2="72" y2="40"/>
    <line x1="72" y1="40" x2="90" y2="40"/>
  </g>
  <!-- L (navy) -->
  <g stroke="#0C1A3A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="102" y1="8" x2="102" y2="40"/>
    <line x1="102" y1="40" x2="120" y2="40"/>
  </g>
  <!-- I (navy) -->
  <g stroke="#0C1A3A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="134" y1="8" x2="134" y2="40"/>
  </g>
</svg>
