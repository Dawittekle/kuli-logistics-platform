<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <title>Kulli Logo — Stacked Lockup</title>
  <!--
    K mark centered above, KULLI wordmark centered below.
    K mark occupies roughly top 60px, wordmark occupies bottom ~28px.
  -->

  <!-- === K MARK (centered, scaled to fit ~48x48 in top area) === -->
  <g transform="translate(36, 2) scale(0.75)">
    <g transform="rotate(2.5, 32, 32)" stroke="#F97316" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="18.5" y1="10" x2="18.5" y2="54" stroke-width="9.5"/>
      <line x1="26" y1="33" x2="48" y2="10" stroke-width="9"/>
      <line x1="26" y1="33" x2="48" y2="54" stroke-width="9"/>
    </g>
  </g>

  <!-- === WORDMARK (centered below mark) === -->
  <!-- Scaled-down wordmark centered at bottom -->
  <g transform="translate(16, 56)">
    <!-- K (orange) -->
    <g stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="6" y1="6" x2="6" y2="34"/>
      <line x1="10.5" y1="21" x2="22" y2="6"/>
      <line x1="10.5" y1="21" x2="22" y2="34"/>
    </g>
    <!-- U (navy) -->
    <g stroke="#0C1A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M30,6 L30,27 Q30,34 36,34 Q42,34 42,27 L42,6"/>
    </g>
    <!-- L (navy) -->
    <g stroke="#0C1A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="51" y1="6" x2="51" y2="34"/>
      <line x1="51" y1="34" x2="64" y2="34"/>
    </g>
    <!-- L (navy) -->
    <g stroke="#0C1A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="72" y1="6" x2="72" y2="34"/>
      <line x1="72" y1="34" x2="85" y2="34"/>
    </g>
    <!-- I (navy) -->
    <g stroke="#0C1A3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="93" y1="6" x2="93" y2="34"/>
    </g>
  </g>
</svg>
