services:
  - type: static
    name: kuli-logistics-landing
    buildCommand: npm install && npm run build:landing
    staticPublishPath: ./apps/landing/dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /about
        destination: /about.html
